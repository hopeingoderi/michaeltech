<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login | MichaelTech Academy</title>
    <link rel="stylesheet" href="assets/css/styles.css" />
  </head>
  <body class="auth-page">
    <main class="auth-shell">
      <section class="auth-panel auth-brand">
        <a href="index.html" class="brand inline"
          ><span class="brand-mark">M</span
          ><span
            ><strong>MichaelTech Academy</strong
            ><small>Admin Access</small></span
          ></a
        >
        <h1>Academy management access.</h1>
        <p>
          Use the admin area to manage students, courses, exams, and
          certificates.
        </p>
        <p><strong>Admin email:</strong> info@michaeltech.ch</p>
      </section>
      <section class="auth-panel">
        <form class="form-card">
          <h2>Admin Login</h2>
          <label>Email<input type="email" value="info@michaeltech.ch" /></label
          ><label
            >Password<input type="password" placeholder="********" /></label
          ><button
            class="btn btn-gold"
            type="button"
            onclick="window.location.href = 'admin-dashboard.html'"
          >
            Login to dashboard
          </button>
        </form>
      </section>
    </main>
  </body>
</html>
